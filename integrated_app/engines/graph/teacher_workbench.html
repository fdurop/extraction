<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>课程图谱编辑与前置知识导航</title>
<style>
:root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#23334a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;background:#fff;border-bottom:1px solid #dce4ef}h1{font-size:23px;margin:0 0 8px}p{line-height:1.65;margin:8px 0}.muted{color:#65758b;font-size:13px}.toolbar{padding:14px 24px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}button,select,input,textarea{font:inherit;border:1px solid #cad5e4;border-radius:7px;padding:8px;background:#fff;color:#23334a}button{cursor:pointer}button:hover{border-color:#3568bf;background:#f0f5ff}button.primary{background:#245db3;color:white}input[type=search]{width:190px}.layout{display:grid;grid-template-columns:minmax(500px,1fr) 345px;gap:16px;padding:0 24px 24px}.canvas,.panel{background:white;border:1px solid #dce4ef;border-radius:12px}.canvas{overflow:auto;min-height:620px;max-height:80vh}.panel{padding:18px;max-height:80vh;overflow:auto}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:18px 0 8px}label.field{display:block;font-size:13px;margin:12px 0 4px}label.field input,label.field textarea,label.field select{display:block;width:100%;margin-top:5px}textarea{min-height:80px}#status{padding:0 24px 14px;min-height:32px;font-size:13px;color:#526985}.item{border:1px solid #dfe6f0;border-radius:8px;padding:10px;margin:9px 0;font-size:13px;overflow-wrap:anywhere}.item button{font-size:12px;margin:5px 4px 0 0}.warning{color:#976000;background:#fff7df;padding:10px;border-radius:8px}.pill{display:inline-block;padding:2px 7px;background:#eaf1fb;border-radius:5px;margin:3px;font-size:12px}.node{cursor:pointer}.node text{pointer-events:none}dialog{border:1px solid #ccd7e6;border-radius:12px;max-width:480px;width:92%}dialog::backdrop{background:#182b4c66}.row{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:32px;color:#65758b}#stats{padding:0 24px 12px;font-size:13px}.legend{padding:0 24px 12px}.legend span{margin-right:18px;font-size:12px}a{color:#245db3}@media(max-width:900px){.layout{grid-template-columns:1fr}.canvas{min-height:400px}.panel{max-height:none}}
</style></head><body>
<header><h1>课程图谱编辑与前置知识导航</h1><p class="muted">按课件梳理教学内容，审核概念关系，导出备课用图。重要程度是估计值，课件归组表示来源，二者都不能代替概念包含关系或先修依据。</p></header>
<div class="toolbar"><button id="import" class="primary">导入图谱 JSON</button><input id="file" type="file" accept=".json" hidden>
<select id="mode" aria-label="展示方式"><option value="documents">按课件组织</option><option value="hierarchy">概念包含与分类</option><option value="prerequisites">前置知识</option></select>
<select id="chapter" aria-label="课件筛选"><option value="">全部课件</option></select>
<select id="importance" aria-label="重要程度"><option value="3">全部重要程度</option><option value="1">仅核心</option><option value="2">核心与次要</option></select>
<label><input type="checkbox" id="details"> 展开素材细节（含模型建议）</label><label><input type="checkbox" id="connected" checked> 关系视图隐藏孤立点</label><input id="search" type="search" placeholder="查找知识点，含收起的细节" aria-label="查找知识点">
<button id="add">新增知识点</button><button id="save">保存可编辑 JSON</button><button id="html">保存编辑页面</button><button id="svg">导出 SVG</button><button id="png">导出 PNG</button></div>
<div id="stats"></div><div class="legend"><span>蓝色：教师确认的知识点</span><span>浅黄：模型建议的知识点</span><span>灰色：待判断或素材细节</span><span>虚线：尚未由教师确认的关系</span></div><div id="status" role="status"></div>
<main class="layout"><section class="canvas" aria-label="课程图谱"><svg id="graph" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="可编辑课程知识图谱"></svg></section><aside class="panel" id="panel"><h2>选择知识点</h2><p class="muted">点击节点可编辑名称、说明、课件归组和教学角色，并查看前置知识与证据。没有图谱时，先导入 concepts_graph_v2.json 或 teacher_graph.json。</p></aside></main>
<dialog id="edgeDialog"><h2>添加知识关系</h2><p class="muted">前置关系的方向是“先学的概念 → 后学的概念”。“包含”的方向是“整体 → 部分”。</p><label class="field">源概念<select id="edgeSource"></select></label><label class="field">关系<select id="edgeType"><option value="PREREQUISITE_OF">是学习……的前置</option><option value="HAS_PART">包含</option><option value="IS_A">是一种</option><option value="RELATED_TO">相关</option></select></label><label class="field">目标概念<select id="edgeTarget"></select></label><label class="field">关系依据或教学理由<textarea id="edgeReason"></textarea></label><div class="row"><button id="edgeSubmit" class="primary">确认并添加</button><button id="edgeCancel">取消</button></div></dialog>
<script id="initialData" type="application/json">/*__INITIAL_GRAPH__*/null</script>
<script>
"use strict";
const $=id=>document.getElementById(id), NS="http://www.w3.org/2000/svg";
let data=JSON.parse($("initialData").textContent.replace("/*__INITIAL_GRAPH__*/",""))||{concepts:[],relationships:[],hierarchy_candidates:[],documents:[],review_items:[]};
let selected=null,dirty=false,editingEdge=-1;
const esc=s=>String(s??"");
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function svgEl(tag,attrs,text){const x=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs||{}))x.setAttribute(k,v);if(text!==undefined)x.textContent=text;return x}
function message(t){$("status").textContent=t}
function nameOf(c){return c.canonical_name}
function roleInfo(c){
 const valid=["learning","detail","pending","context_dependent"],labels={learning:"知识点",detail:"素材细节",pending:"待判断",context_dependent:"多页用途不一"};
 if(c.role_review_status==="approved"&&valid.includes(c.teaching_role))return {key:c.teaching_role,label:"教师确认 · "+labels[c.teaching_role],fill:c.teaching_role==="learning"?"#ecf3ff":"#f5f7fa"};
 if(c.role_review_status==="rejected")return {key:"pending",label:"角色建议未采纳 · 待判断",fill:"#f5f7fa"};
 const suggested=c.suggested_teaching_role;return {key:labels[suggested]?suggested:"pending",label:labels[suggested]&&suggested!=="pending"?"模型建议 · "+labels[suggested]:"待教师分类",fill:suggested==="learning"?"#fff5d6":"#f5f7fa"};
}
function normalize(raw){
 if(!raw||!Array.isArray(raw.concepts)||!Array.isArray(raw.relationships))throw Error("需要包含 concepts 和 relationships 的图谱。前端 nodes/links 导出请先通过 graph_quality.py 转换。");
 const names=new Set();for(const c of raw.concepts){if(typeof c.canonical_name!=="string"||!c.canonical_name.trim()||names.has(c.canonical_name))throw Error("知识点名称为空或重复，请先修正后导入");names.add(c.canonical_name)}
 for(const r of raw.relationships){if(!names.has(r.source)||!names.has(r.target))throw Error("关系引用了不存在的知识点");}
 raw.documents??=[];raw.hierarchy_candidates??=[];raw.review_items??=[];raw.layout??={};
 for(const c of raw.concepts){c.importance_level??=c.layer??3;c.teaching_role??="pending"}
 const kept=[];for(const r of raw.relationships){if(r.auto_generated&&["HAS_PART","PART_OF","IS_A","HAS_PARAMETER"].includes(r.relation)&&!["approved","rejected"].includes(r.review_status)){raw.hierarchy_candidates.push({...r,review_status:"pending"})}else kept.push(r)}raw.relationships=kept;return raw;
}
function options(select,items,value){select.replaceChildren();for(const [v,t] of items){const o=el("option",t);o.value=v;select.append(o)}select.value=value||""}
function chapterLabel(id){const d=data.documents.find(d=>d.document_id===id);return d?(d.file_name||d.chapter_title||id):"未归组"}
function refreshOptions(){options($("chapter"),[["","全部课件"],...data.documents.map(d=>[d.document_id,d.file_name||d.chapter_title||d.document_id])],$("chapter").value)}
function activeRelations(){const mode=$("mode").value;return data.relationships.filter(r=>r.review_status!=="rejected"&&(mode==="prerequisites"?r.relation==="PREREQUISITE_OF":mode==="hierarchy"?["HAS_PART","PART_OF","IS_A"].includes(r.relation):false))}
function pair(r){return ["PART_OF","IS_A"].includes(r.relation)?[r.target,r.source]:[r.source,r.target]}
function levels(nodes,rels){const names=new Set(nodes.map(nameOf)),degrees=new Map(nodes.map(c=>[nameOf(c),0])),next=new Map(nodes.map(c=>[nameOf(c),[]])),depth=new Map(nodes.map(c=>[nameOf(c),0]));
 for(const r of rels){const [a,b]=pair(r);if(names.has(a)&&names.has(b)){next.get(a).push(b);degrees.set(b,degrees.get(b)+1)}}
 const q=[...degrees].filter(([n,d])=>d===0).map(([n])=>n);let processed=0;while(q.length){const a=q.shift();processed++;for(const b of next.get(a)){depth.set(b,Math.max(depth.get(b),depth.get(a)+1));degrees.set(b,degrees.get(b)-1);if(!degrees.get(b))q.push(b)}}
 return {depth,cycle:processed<nodes.length};
}
function render(){
 const search=$("search").value.trim().toLowerCase(),chapter=$("chapter").value,limit=Number($("importance").value),mode=$("mode").value;
 const connectedNames=new Set(activeRelations().flatMap(r=>[r.source,r.target]));
 const nodes=data.concepts.filter(c=>(mode==="documents"||!$("connected").checked||connectedNames.has(nameOf(c)))&&(!chapter||c.chapter_id===chapter)&&Number(c.importance_level||3)<=limit&&($("details").checked||search||roleInfo(c).key!=="detail")&&(!search||[c.canonical_name,c.description,...(c.aliases||[])].join(" ").toLowerCase().includes(search)));
 const visible=new Set(nodes.map(nameOf)),rels=activeRelations().filter(r=>visible.has(r.source)&&visible.has(r.target));
 const detailCount=data.concepts.filter(c=>roleInfo(c).key==="detail").length,confirmedCount=data.concepts.filter(c=>c.role_review_status==="approved"&&c.teaching_role==="learning").length;
 $("stats").textContent=`显示 ${nodes.length} / ${data.concepts.length} 个概念 · 教师确认知识点 ${confirmedCount} 个 · 素材细节 ${detailCount} 个（${$("details").checked?"已展开":search?"搜索时可见":"默认收起"}） · 当前视图 ${rels.length} 条关系 · ${data.hierarchy_candidates.length} 条归组候选 · ${data.review_items.length} 条问题记录待复核${dirty?" · 有未导出的修改":""}`;
 const svg=$("graph");svg.replaceChildren();const defs=svgEl("defs"),marker=svgEl("marker",{id:"arrow",viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:6,markerHeight:6,orient:"auto-start-reverse"});marker.append(svgEl("path",{d:"M 0 0 L 10 5 L 0 10 z",fill:"#8b9cb4"}));defs.append(marker);svg.append(defs);
 const positions=new Map();let width=1000,height=620;const groups=new Map();
 if(mode==="documents"){
  for(const c of nodes){const key=c.chapter_id||"";if(!groups.has(key))groups.set(key,[]);groups.get(key).push(c)}
  let y=92;for(const [chapter,list] of [...groups].sort((a,b)=>chapterLabel(a[0]).localeCompare(chapterLabel(b[0]),"zh",{numeric:true}))){svg.append(svgEl("text",{x:28,y,fill:"#203b61","font-size":16,"font-weight":600},chapterLabel(chapter)));y+=25;list.sort((a,b)=>a.importance_level-b.importance_level||a.canonical_name.localeCompare(b.canonical_name,"zh"));list.forEach((c,i)=>positions.set(nameOf(c),{x:28+(i%3)*300,y:y+Math.floor(i/3)*90}));y+=Math.ceil(list.length/3)*90+35}height=Math.max(height,y);
 }else{
  const layout=levels(nodes,rels);if(layout.cycle)message("当前关系存在循环，请审核修改。循环图暂不生成学习顺序。");
  for(const c of nodes){const level=layout.depth.get(nameOf(c));if(!groups.has(level))groups.set(level,[]);groups.get(level).push(c)}
  for(const [level,list] of groups){list.forEach((c,i)=>positions.set(nameOf(c),{x:30+level*330,y:100+i*100}));width=Math.max(width,level*330+340);height=Math.max(height,110+list.length*100)}
 }
 svg.setAttribute("width",width);svg.setAttribute("height",height);svg.setAttribute("viewBox",`0 0 ${width} ${height}`);svg.style.maxWidth=mode==="documents"?"100%":"";svg.style.height=mode==="documents"?"auto":"";
 svg.append(svgEl("rect",{width,height,fill:"#fff"})); // move the background behind the headings
 svg.insertBefore(svg.lastChild,svg.firstChild);
 svg.append(svgEl("text",{x:28,y:35,fill:"#23334a","font-size":20,"font-weight":600},data.course?.course_name&&data.course.course_name!=="default_course"?data.course.course_name:"课程知识图谱"));
 svg.append(svgEl("text",{x:28,y:58,fill:"#65758b","font-size":12},mode==="documents"?"按课件归组；模型建议与教师确认分别标注；细节收起时仍可搜索":mode==="prerequisites"?"箭头方向：前置知识 → 当前知识；虚线表示尚未确认":"箭头方向：上位或整体 → 下位或部分；分类关系与组成关系仍需分别审核"));
 for(const r of rels){const [a,b]=pair(r),p=positions.get(a),q=positions.get(b);svg.append(svgEl("path",{d:`M ${p.x+260} ${p.y+30} C ${p.x+300} ${p.y+30},${q.x-35} ${q.y+30},${q.x} ${q.y+30}`,fill:"none",stroke:"#8b9cb4","stroke-width":1.5,"stroke-dasharray":r.review_status==="approved"?"":"5 4","marker-end":"url(#arrow)"}))}
 for(const c of nodes){const p=positions.get(nameOf(c)),role=roleInfo(c),g=svgEl("g",{class:"node",tabindex:0,"aria-label":c.canonical_name});g.append(svgEl("rect",{x:p.x,y:p.y,width:260,height:64,rx:9,fill:role.fill,stroke:selected===nameOf(c)?"#245db3":"#cdd8e7","stroke-width":selected===nameOf(c)?2:1}));
  const label=c.canonical_name.length>17?c.canonical_name.slice(0,16)+"…":c.canonical_name;g.append(svgEl("text",{x:p.x+12,y:p.y+27,fill:"#23334a","font-size":14},label));g.append(svgEl("text",{x:p.x+12,y:p.y+48,fill:"#65758b","font-size":11},`${role.label} · ${c.sources?.length||c.source_page_ids?.length||0} 处来源`));g.append(svgEl("title",{},c.canonical_name));const choose=()=>{selected=nameOf(c);render();renderPanel()};g.onclick=choose;g.onkeydown=e=>{if(e.key==="Enter")choose()};svg.append(g)}
 if(!nodes.length)svg.append(svgEl("text",{x:35,y:140,fill:"#65758b","font-size":16},mode==="prerequisites"&&!activeRelations().length?"尚未记录前置关系，请教师结合教学依据补充并确认。":mode==="hierarchy"&&!activeRelations().length?"尚无概念包含或分类关系；自动归组候选需要逐条审核。":"没有可显示的知识点，请导入图谱或调整筛选。"));
}
function field(parent,label,type,value){const l=el("label",label,"field"),input=el(type==="textarea"?"textarea":"input");input.value=value||"";l.append(input);parent.append(l);return input}
function appendSources(parent,sources){for(const source of sources||[]){const box=el("div",undefined,"item");box.append(el("div",`${chapterLabel(source.document_id)} · 第 ${source.page_no??"?"} 页`));if(source.title)box.append(el("p",source.title,"muted"));if(source.extracted_text){const content=el("p",source.extracted_text);content.style.whiteSpace="pre-wrap";box.append(el("p","课件提取文本（未由教师核对）","muted"),content)}for(const evidence of source.material_evidence||[]){box.append(el("p",`${evidence.node_type} · ${evidence.evidence_id} · 素材描述，需核对原图`,"muted"),el("p",evidence.text))}parent.append(box)}}
function relatedItem(r,index,candidate=false){const box=el("div",undefined,"item");box.append(el("div",`${r.source} — ${r.relation} → ${r.target}`));if(r.description)box.append(el("p",r.description,"muted"));box.append(el("span",r.review_status==="approved"?"已由教师确认":"待教师确认","pill"));
 for(const item of data.semantic_priority_review?.items||[])if(item.source===r.source&&item.target===r.target&&item.relation===r.relation){box.append(el("p","开发复核提示（待教师判断）："+item.reason,"warning"));if(item.proposed_relation)box.append(el("p","建议核对关系类型："+item.proposed_relation+"（未自动修改）","muted"))}
 if(r.sources?.length)appendSources(fold(box,"查看关系来源与适用页面"),r.sources);
 const approve=el("button",candidate?"审核后采用":"确认关系");approve.onclick=()=>{const proposed={...r,review_status:"approved",reviewed_at:new Date().toISOString()};const rest=data.relationships.filter((_,i)=>candidate||i!==index);if(proposed.relation==="PREREQUISITE_OF"&&levels(data.concepts,[...rest,proposed].filter(x=>x.relation==="PREREQUISITE_OF")).cycle){message("这条前置关系会形成循环，未采用。请先修正相关关系。");return}if(!confirm(`确认关系方向和教学依据？\n${r.source} — ${r.relation} → ${r.target}`))return;if(candidate){data.relationships.push(proposed);data.hierarchy_candidates.splice(index,1)}else data.relationships[index]=proposed;changed()};
 const remove=el("button",candidate?"不采用":"删除关系");remove.onclick=()=>{if(confirm("确认移除这条关系？")){(candidate?data.hierarchy_candidates:data.relationships).splice(index,1);changed()}};box.append(approve,remove);if(!candidate){const edit=el("button","修改方向或类型");edit.onclick=()=>showEdge(r.source,index);box.append(edit)}return box;
}
function fold(parent,title){const d=el("details"),summary=el("summary",title);d.style.marginTop="16px";summary.style.cursor="pointer";d.append(summary);parent.append(d);return d}
function renderPanel(){const panel=$("panel"),c=data.concepts.find(c=>nameOf(c)===selected);panel.replaceChildren();if(!c){panel.append(el("h2","选择知识点"),el("p","点击图中节点编辑内容；修改后请保存 JSON 或编辑页面。","muted"));return}
 panel.append(el("h2","知识点与教学用途"),el("p",roleInfo(c).label,"pill"));const name=field(panel,"名称","input",nameOf(c)),description=field(panel,"说明","textarea",c.description),aliases=field(panel,"别名（每行一个）","textarea",(c.aliases||[]).join("\n"));
 const conflicts=data.quality?.alias_name_conflicts?.filter(x=>x.concept===nameOf(c)||x.other_concept===nameOf(c))||[];if(conflicts.length)panel.append(el("p","别名与其他知识点发生重叠，请核对是否错误合并。修改别名不会自动重新分配历史证据。","warning"));if((c.aliases||[]).length>=10)panel.append(el("p","该节点合并了较多名称，建议核对是否混入不同设备类型或上下位概念。","warning"));
 if(c.page_observations?.length){const contextPanel=fold(panel,"页面语境与模型建议（待确认）");for(const observation of c.page_observations){const box=el("div",undefined,"item"),source=(c.sources||[]).find(s=>s.page_id===observation.page_id);box.append(el("div",source?`${chapterLabel(source.document_id)} · 第 ${source.page_no} 页`:observation.page_id));box.append(el("p",`模型建议：${observation.suggested_teaching_role==="learning"?"教学知识点":observation.suggested_teaching_role==="detail"?"素材细节":"待判断"}`));if(observation.learning_objective)box.append(el("p",observation.learning_objective));if(observation.aliases_suggested_in_context?.length)box.append(el("p","本页建议称呼（未设为全局别名）："+observation.aliases_suggested_in_context.join("、"),"muted"));if(observation.figure_only_evidence)box.append(el("p","依据仅来自图片描述，需核对它在本页是主要内容还是举例。","warning"));contextPanel.append(box)}}
 const roleLabel=el("label","教学角色","field"),role=el("select");options(role,[["pending","待判断"],["learning","教学知识点"],["detail","素材细节（默认收起）"]],c.teaching_role);roleLabel.append(role);panel.append(roleLabel);
 const chapterLabelEl=el("label","来源课件归组","field"),chapter=el("select");options(chapter,[["","未归组"],...data.documents.map(d=>[d.document_id,d.file_name||d.document_id])],c.chapter_id);chapterLabelEl.append(chapter);panel.append(chapterLabelEl);
 const save=el("button","应用修改并确认所选教学角色","primary");save.onclick=()=>{const old=nameOf(c),next=name.value.trim();if(!next||data.concepts.some(x=>x!==c&&nameOf(x)===next)){message("名称不能为空或与其他知识点重复");return}c.canonical_name=next;c.description=description.value;c.aliases=[...new Set(aliases.value.split("\n").map(x=>x.trim()).filter(Boolean))];c.teaching_role=role.value;c.role_review_status="approved";c.role_reviewed_at=new Date().toISOString();c.chapter_id=chapter.value;for(const r of [...data.relationships,...data.hierarchy_candidates]){if(r.source===old)r.source=next;if(r.target===old)r.target=next}selected=next;changed()};panel.append(save);
 const sourcesPanel=fold(panel,`课件证据（${c.sources?.length||0}）`);if(!(c.sources||[]).length)sourcesPanel.append(el("p","尚未关联课件页，请通过带 kg_data 的导出流程补齐来源。","muted"));appendSources(sourcesPanel,c.sources);
 panel.append(el("h3","先学什么"));const parents=data.relationships.filter(r=>r.relation==="PREREQUISITE_OF"&&r.target===nameOf(c));if(!parents.length)panel.append(el("p","尚未记录前置关系；这不代表没有前置知识。","muted"));for(const r of parents){const b=el("button",r.source+(r.review_status==="approved"?"":"（待确认）"));b.onclick=()=>{selected=r.source;$("search").value="";$("chapter").value="";render();renderPanel()};panel.append(b)}
 const pathButton=el("button","查看已确认的补学顺序");pathButton.onclick=()=>{try{const path=studyPath(nameOf(c));message(path.length?"建议复习顺序："+path.join(" → ")+" → "+nameOf(c):"当前没有已确认的前置知识；可请教师补充审核。")}catch(e){message(e.message)}};panel.append(pathButton);

function studyPath(target){const parents=new Map(data.concepts.map(c=>[nameOf(c),[]]));for(const r of data.relationships)if(r.relation==="PREREQUISITE_OF"&&r.review_status==="approved")parents.get(r.target).push(r.source);const done=new Set(),visiting=new Set(),order=[];function visit(n){if(visiting.has(n))throw Error("前置知识存在循环，请教师审核后再生成学习顺序");if(done.has(n))return;visiting.add(n);for(const p of parents.get(n)||[])visit(p);visiting.delete(n);done.add(n);if(n!==target)order.push(n)}visit(target);return order}
function changed(){dirty=true;message("修改已应用到当前页面，请导出保存。");render();renderPanel()}
function showEdge(source,index=-1){editingEdge=index;const r=index>=0?data.relationships[index]:null,items=data.concepts.map(c=>[nameOf(c),nameOf(c)]);options($("edgeSource"),items,r?.source||source);options($("edgeTarget"),items,r?.target||items.find(x=>x[0]!==source)?.[0]);if(r&&!Array.from($("edgeType").options).some(o=>o.value===r.relation)){const o=el("option",r.relation);o.value=r.relation;$("edgeType").append(o)}$("edgeType").value=r?.relation||"PREREQUISITE_OF";$("edgeReason").value=r?.description||"";$("edgeDialog").showModal()}
function download(blob,name){const url=URL.createObjectURL(blob),a=el("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
$("edgeSubmit").onclick=()=>{const source=$("edgeSource").value,target=$("edgeTarget").value,relation=$("edgeType").value,description=$("edgeReason").value.trim();if(source===target||!description){message("请选择两个不同概念，并填写教学依据。");return}const rest=data.relationships.filter((_,i)=>i!==editingEdge);if(rest.some(r=>r.source===source&&r.target===target&&r.relation===relation)){message("该关系已存在");return}const r={...(editingEdge>=0?data.relationships[editingEdge]:{}),source,target,relation,description,review_status:"approved",reviewed_at:new Date().toISOString(),origin:"teacher_edit"};if(relation==="PREREQUISITE_OF"&&levels(data.concepts,[...rest,r].filter(x=>x.relation==="PREREQUISITE_OF")).cycle){message("这条前置关系会形成循环，未添加。");return}if(editingEdge>=0)data.relationships[editingEdge]=r;else data.relationships.push(r);$("edgeDialog").close();changed()};$("edgeCancel").onclick=()=>$("edgeDialog").close();
$("import").onclick=()=>$("file").click();$("file").onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const next=normalize(JSON.parse(await file.text()));if(dirty&&!confirm("当前有未导出的修改，仍要导入新文件吗？"))return;data=next;selected=null;dirty=false;refreshOptions();render();renderPanel();message("已导入 "+file.name)}catch(error){message("导入失败："+error.message)}finally{e.target.value=""}};
$("add").onclick=()=>{const name=prompt("新知识点名称");if(!name||!name.trim())return;if(data.concepts.some(c=>nameOf(c)===name.trim())){message("名称已存在");return}data.concepts.push({canonical_name:name.trim(),description:"",teaching_role:"learning",role_review_status:"approved",role_reviewed_at:new Date().toISOString(),review_status:"pending",importance_level:2,chapter_id:$("chapter").value,sources:[],origin:"teacher_edit"});selected=name.trim();changed()};
$("save").onclick=()=>{download(new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"}),"teacher_graph.json");message("已生成下载文件；请确认文件已保存。当前修改不会自动写回数据库。")};
$("html").onclick=()=>{const clone=document.documentElement.cloneNode(true);clone.querySelector("#initialData").textContent=JSON.stringify(data).replace(/</g,"\\u003c");clone.querySelector("#graph").replaceChildren();clone.querySelector("#panel").replaceChildren();clone.querySelector("#status").textContent="";download(new Blob(["<!doctype html>\n"+clone.outerHTML],{type:"text/html;charset=utf-8"}),"teacher_workbench.html")};

$("png").onclick=()=>{const svg=$("graph"),w=Number(svg.getAttribute("width")),h=Number(svg.getAttribute("height")),scale=Math.min(2,12000/Math.max(w,h),Math.sqrt(32000000/(w*h))),url=URL.createObjectURL(new Blob([graphSvg()],{type:"image/svg+xml"})),image=new Image();image.onload=()=>{try{const canvas=document.createElement("canvas");canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);const context=canvas.getContext("2d");context.drawImage(image,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>{if(blob)download(blob,"course_graph.png");else message("图片过大，请按课件筛选后导出")},"image/png")}catch(e){message("导出失败："+e.message)}finally{URL.revokeObjectURL(url)}};image.onerror=()=>{URL.revokeObjectURL(url);message("图片渲染失败，可先使用 SVG 导出")};image.src=url};
