{% load static %}
<!-- 登录页面 -->
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>登录 - fdurop</title>
   <style>
    /* 页面整体布局 */
    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main.auth-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-box {
      background: #fff;
      padding: 40px 30px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }

    .auth-box h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 24px;
      color: #333;
      text-align: center;
    }

    .auth-box label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #555;
    }

    .auth-box input[type="text"],
    .auth-box input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .auth-box button.primary-btn {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .auth-box button.primary-btn:hover {
      background-color: #0056b3;
    }

    .auth-box p.tip {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }

    .auth-box p.tip a {
      color: #007bff;
      text-decoration: none;
    }

    .auth-box p.tip a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="auth-container">
    <div class="auth-box">
      <h2>登录账号</h2>
      <form id="loginForm">
        <label for="username">用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" required>

        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" required>

        <button type="submit" class="primary-btn">登录</button>
      </form>
      <p class="tip">还没有账号？ <a href="/register/">注册</a></p>
      <div id="loginMessage" class="status-message" hidden></div>
    </div>
  </main>
<script src="{% static 'js/app_contract.js' %}"></script>
<script>

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  const loginMessage = document.getElementById("loginMessage");

  try {
    const res = await fetch("/login", {
      method: "POST",
      credentials: "same-origin",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ username, password })
    });
    const result = await res.json();

    if (res.ok && result.success) {
      localStorage.removeItem("qa_user_role");
      localStorage.removeItem("qa_auth_token");
      loginMessage.textContent = "登录成功，正在跳转...";
      loginMessage.className = "status-message success";
      loginMessage.hidden = false;
      setTimeout(() => {
        // 根据角色跳转不同页面
        if (result.role === "teacher") {
          location.href = "/teacher/";
        } else {
          location.href = "/";
        }
      }, 1000);
    } else {
      loginMessage.textContent = result.error || "登录失败";
      loginMessage.className = "status-message error";
      loginMessage.hidden = false;
    }
  } catch (err) {
    console.error(err);
    loginMessage.textContent = "请求失败，请检查网络";
    loginMessage.className = "status-message error";
    loginMessage.hidden = false;
  }
});
</script>
</body>
</html>
